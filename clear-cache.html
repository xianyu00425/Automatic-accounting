<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除缓存并更新</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FAF8FF;
            color: #3D3D5C;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(156,136,240,0.08);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .step {
            text-align: left;
            margin: 15px 0;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 12px;
        }
        .step-num {
            display: inline-block;
            width: 28px;
            height: 28px;
            background: #9C88F0;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            margin-right: 10px;
        }
        button {
            background: #9C88F0;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        button:active {
            background: #7E6FD4;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #9B9BB0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>更新到最新版本</h1>
        <p>点击下方按钮清除缓存并加载最新版本</p>
        <div class="step">
            <span class="step-num">1</span>点击"清除缓存并更新"
        </div>
        <div class="step">
            <span class="step-num">2</span>等待页面自动跳转
        </div>
        <div class="step">
            <span class="step-num">3</span>重新尝试导入账单
        </div>
        <button onclick="clearAndReload()">清除缓存并更新</button>
        <div class="status" id="status"></div>
    </div>
    <script>
        function clearAndReload() {
            const status = document.getElementById('status');
            status.textContent = '正在清除缓存...';

            // 清除 Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                });
            }

            // 清除所有缓存
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }

            // 清除 localStorage 中的缓存标记
            localStorage.removeItem('app-version');

            status.textContent = '缓存已清除，正在跳转...';

            // 强制刷新，添加时间戳避免缓存
            setTimeout(function() {
                window.location.href = './自动记账.html?t=' + Date.now();
            }, 500);
        }

        // 自动检查版本
        window.addEventListener('load', function() {
            fetch('./自动记账.html?t=' + Date.now())
                .then(function(response) {
                    return response.text();
                })
                .then(function(html) {
                    // 检查是否包含修复代码
                    if (html.includes('统一使用 XLSX 库解析所有文件格式')) {
                        document.getElementById('status').textContent = '已是最新版本，可以直接导入账单';
                    } else {
                        document.getElementById('status').textContent = '检测到旧版本，请点击按钮更新';
                    }
                })
                .catch(function() {
                    document.getElementById('status').textContent = '网络检查失败，请点击按钮强制更新';
                });
        });
    </script>
</body>
</html>
